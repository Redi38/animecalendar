<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#14121a">
<meta name="description" content="Календарь выхода аниме на русском: сезоны, поиск и анонсы продолжений того, что вы уже посмотрели.">
<title>Аниме-календарь</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/css/fonts.css">
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/header.css">
<link rel="stylesheet" href="/static/css/layout.css">
<link rel="stylesheet" href="/static/css/cards.css">
<link rel="stylesheet" href="/static/css/dialogs.css">
<link rel="stylesheet" href="/static/css/motion.css">
<link rel="stylesheet" href="/static/css/mobile.css">
<script src="/static/js/theme-init.js"></script>
<script type="module" src="/static/js/main.js"></script>
</head>
<body>
<a class="skip-link" href="#view">К содержимому</a>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>Аниме-календарь</span>
    </div>

    <nav class="nav" aria-label="Разделы">
      <a href="#/" data-nav="season">Афиша</a>
      <a href="#/upcoming" data-nav="upcoming">Мои анонсы <span class="nav-badge" id="nav-badge" hidden></span></a>
      <a href="#/watched" data-nav="watched">Просмотрено <span class="nav-count" id="nav-count"></span></a>
    </nav>

    <div class="search" id="search">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search-input" type="search" placeholder="Найти аниме…" autocomplete="off" spellcheck="false"
             role="combobox" aria-expanded="false" aria-controls="search-panel" aria-label="Поиск по названию">
      <div class="search-panel" id="search-panel" role="listbox" hidden></div>
    </div>

    <button class="icon-btn sync-btn" id="sync-btn" type="button" hidden aria-label="Синхронизация" data-state="off">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18a4 4 0 0 1-.6-7.96A6 6 0 0 1 18 9.5a4.2 4.2 0 0 1-.5 8.5z"/><path class="sync-tick" d="M9.5 13.5l2 2 3.5-4"/></svg>
    </button>

    <button class="icon-btn theme-toggle" id="theme-toggle" type="button" aria-label="Переключить тему">
      <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<main id="view" class="container" tabindex="-1" aria-live="polite"></main>

<dialog id="title-dialog" aria-labelledby="dialog-title"></dialog>
<div class="toasts" id="toasts" aria-live="polite"></div>

<noscript><p class="container">Для работы календаря нужен включённый JavaScript.</p></noscript>
</body>
</html>
